plugins {
    id "com.android.application"
}

def quoted = { value -> "\"${String.valueOf(value).replace("\\", "\\\\").replace("\"", "\\\"")}\"" }

android {
    namespace "co.spax.codexgateway"
    compileSdk 35

    defaultConfig {
        applicationId "co.spax.codexgateway"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "FIREBASE_APPLICATION_ID", quoted(project.findProperty("CODEX_FIREBASE_APPLICATION_ID") ?: "")
        buildConfigField "String", "FIREBASE_PROJECT_ID", quoted(project.findProperty("CODEX_FIREBASE_PROJECT_ID") ?: "")
        buildConfigField "String", "FIREBASE_API_KEY", quoted(project.findProperty("CODEX_FIREBASE_API_KEY") ?: "")
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.18.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core:1.16.0"
    implementation "androidx.work:work-runtime:2.10.1"
}
